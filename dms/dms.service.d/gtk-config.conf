[Service]
# DMS currently touches these files during startup before loading the disabled
# GTK theming setting. Restore the Dotter-managed configuration afterwards.
ExecStartPost=/usr/bin/ln -sfn %h/.dotfiles/gtk/gtk-3.0/gtk.css %h/.config/gtk-3.0/gtk.css
ExecStartPost=/usr/bin/ln -sfn %h/.dotfiles/gtk/gtk-4.0/gtk.css %h/.config/gtk-4.0/gtk.css
