[Service]
# Z.ai Coding Plan key for the DMS AI Quotas plugin. Rendered by Dotter from
# the untracked .dotter/local.toml (variable ai_quotas.zai_api_key), never
# committed. fetch-usage.sh falls back to ANTHROPIC_AUTH_TOKEN when the
# plugin's own zaiApiKey setting is empty, so the key stays out of
# plugin_settings.json.
Environment=ANTHROPIC_AUTH_TOKEN={{ai_quotas.zai_api_key}}
